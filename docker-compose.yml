version: '3.8'

services:
  api-serfor:
    build:
      context: .
      dockerfile: Dockerfile
    image: serfor/api-python:1.0.0
    container_name: api-python-serfor-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    mem_limit: 2g     
    cpus: 2          
    restart: unless-stopped

volumes:
  storage_data: